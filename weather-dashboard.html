<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Weather Dashboard</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dff3ff, #f5f9ff);
      color: #17324d;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: min(900px, 100%);
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 36px;
    }

    .subtitle {
      text-align: center;
      margin: 0 0 28px;
      color: #557086;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    #cityInput {
      flex: 1;
      padding: 14px 16px;
      border: 1px solid #b9cddd;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    #cityInput:focus {
      border-color: #3182ce;
    }

    #searchBtn {
      padding: 14px 22px;
      border: none;
      border-radius: 10px;
      background: #1769aa;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #searchBtn:hover {
      background: #125789;
    }

    #searchBtn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      text-align: center;
      background: #fff3cd;
      color: #664d03;
    }

    .weather-card {
      display: none;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(33, 77, 112, 0.12);
    }

    .location {
      text-align: center;
      margin-bottom: 24px;
    }

    .location h2 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    .location p {
      margin: 0;
      color: #60788b;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .metric {
      padding: 24px 16px;
      text-align: center;
      border-radius: 14px;
      background: #eef7fd;
    }

    .metric .icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .metric h3 {
      margin: 0 0 8px;
      font-size: 15px;
      color: #60788b;
    }

    .metric p {
      margin: 0;
      font-size: 28px;
      font-weight: bold;
    }

    .details {
      margin-top: 22px;
      padding: 18px;
      border-top: 1px solid #dce7ef;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
    }

    .detail span:first-child {
      color: #60788b;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 18px;
      color: #557086;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #708696;
    }

    @media (max-width: 650px) {
      .metrics {
        grid-template-columns: 1fr;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .search-box {
        flex-direction: column;
      }

      #searchBtn {
        width: 100%;
      }

      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>🌤️ Live Weather Dashboard</h1>
    <p class="subtitle">Search for a city to view current weather conditions</p>

    <form id="searchForm" class="search-box">
      <input
        id="cityInput"
        type="text"
        placeholder="Enter city name, e.g. Chennai"
        autocomplete="off"
        required
      >
      <button id="searchBtn" type="submit">Search</button>
    </form>

    <div id="loading" class="loading">Fetching live weather data...</div>
    <div id="message" class="message"></div>

    <section id="weatherCard" class="weather-card">
      <div class="location">
        <h2 id="locationName">--</h2>
        <p id="locationDetails">--</p>
      </div>

      <div class="metrics">
        <article class="metric">
          <div class="icon">🌡️</div>
          <h3>Temperature</h3>
          <p id="temperature">--</p>
        </article>

        <article class="metric">
          <div class="icon">💧</div>
          <h3>Humidity</h3>
          <p id="humidity">--</p>
        </article>

        <article class="metric">
          <div class="icon">💨</div>
          <h3>Wind Speed</h3>
          <p id="windSpeed">--</p>
        </article>
      </div>

      <div class="details">
        <div class="detail">
          <span>Weather</span>
          <strong id="weatherDescription">--</strong>
        </div>
        <div class="detail">
          <span>Feels Like</span>
          <strong id="feelsLike">--</strong>
        </div>
        <div class="detail">
          <span>Wind Direction</span>
          <strong id="windDirection">--</strong>
        </div>
        <div class="detail">
          <span>Data Time</span>
          <strong id="dataTime">--</strong>
        </div>
      </div>
    </section>

    <p class="footer">
      Weather data provided by Open-Meteo public REST APIs.
    </p>
  </main>

  <script>
    const GEOCODING_API = "https://geocoding-api.open-meteo.com/v1/search";
    const WEATHER_API = "https://api.open-meteo.com/v1/forecast";

    const searchForm = document.getElementById("searchForm");
    const cityInput = document.getElementById("cityInput");
    const searchBtn = document.getElementById("searchBtn");
    const loading = document.getElementById("loading");
    const message = document.getElementById("message");
    const weatherCard = document.getElementById("weatherCard");

    const locationName = document.getElementById("locationName");
    const locationDetails = document.getElementById("locationDetails");
    const temperature = document.getElementById("temperature");
    const humidity = document.getElementById("humidity");
    const windSpeed = document.getElementById("windSpeed");
    const weatherDescription = document.getElementById("weatherDescription");
    const feelsLike = document.getElementById("feelsLike");
    const windDirection = document.getElementById("windDirection");
    const dataTime = document.getElementById("dataTime");

    // Weather code descriptions from Open-Meteo.
    function getWeatherDescription(code) {
      const descriptions = {
        0: "Clear sky",
        1: "Mainly clear",
        2: "Partly cloudy",
        3: "Overcast",
        45: "Fog",
        48: "Depositing rime fog",
        51: "Light drizzle",
        53: "Moderate drizzle",
        55: "Dense drizzle",
        56: "Light freezing drizzle",
        57: "Dense freezing drizzle",
        61: "Slight rain",
        63: "Moderate rain",
        65: "Heavy rain",
        66: "Light freezing rain",
        67: "Heavy freezing rain",
        71: "Slight snow",
        73: "Moderate snow",
        75: "Heavy snow",
        77: "Snow grains",
        80: "Slight rain showers",
        81: "Moderate rain showers",
        82: "Violent rain showers",
        85: "Slight snow showers",
        86: "Heavy snow showers",
        95: "Thunderstorm",
        96: "Thunderstorm with slight hail",
        99: "Thunderstorm with heavy hail"
      };

      return descriptions[code] || "Unknown conditions";
    }

    function getWindDirection(degrees) {
      const directions = [
        "N", "NNE", "NE", "ENE",
        "E", "ESE", "SE", "SSE",
        "S", "SSW", "SW", "WSW",
        "W", "WNW", "NW", "NNW"
      ];

      const index = Math.round(degrees / 22.5) % 16;
      return `${directions[index]} (${Math.round(degrees)}°)`;
    }

    function showMessage(text) {
      message.textContent = text;
      message.style.display = "block";
    }

    function hideMessage() {
      message.style.display = "none";
    }

    function setLoading(isLoading) {
      loading.style.display = isLoading ? "block" : "none";
      searchBtn.disabled = isLoading;
    }

    // Step 1: Convert city name into latitude and longitude.
    async function getCityCoordinates(city) {
      const url = new URL(GEOCODING_API);
      url.searchParams.set("name", city);
      url.searchParams.set("count", "1");
      url.searchParams.set("language", "en");
      url.searchParams.set("format", "json");

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Unable to connect to the city search service.");
      }

      const data = await response.json();

      if (!data.results || data.results.length === 0) {
        throw new Error(`City "${city}" was not found. Try another city name.`);
      }

      return data.results[0];
    }

    // Step 2: Fetch current weather using the coordinates.
    async function getWeather(latitude, longitude) {
      const url = new URL(WEATHER_API);

      url.searchParams.set("latitude", latitude);
      url.searchParams.set("longitude", longitude);
      url.searchParams.set(
        "current",
        "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m"
      );
      url.searchParams.set("timezone", "auto");

      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("Unable to fetch weather data right now.");
      }

      return await response.json();
    }

    // Step 3: Render JSON data into the dashboard.
    function renderWeather(city, weather) {
      const current = weather.current;

      locationName.textContent = city.name;
      locationDetails.textContent =
        `${city.admin1 ? city.admin1 + ", " : ""}${city.country}`;

      temperature.textContent = `${current.temperature_2m} °C`;
      humidity.textContent = `${current.relative_humidity_2m}%`;
      windSpeed.textContent = `${current.wind_speed_10m} km/h`;

      weatherDescription.textContent =
        getWeatherDescription(current.weather_code);

      feelsLike.textContent = `${current.apparent_temperature} °C`;
      windDirection.textContent =
        getWindDirection(current.wind_direction_10m);

      dataTime.textContent =
        new Date(current.time).toLocaleString();

      weatherCard.style.display = "block";
    }

    // Main search operation using async/await.
    async function searchWeather(city) {
      hideMessage();
      weatherCard.style.display = "none";
      setLoading(true);

      try {
        const cityData = await getCityCoordinates(city);
        const weatherData = await getWeather(
          cityData.latitude,
          cityData.longitude
        );

        renderWeather(cityData, weatherData);
      } catch (error) {
        console.error("Weather error:", error);
        showMessage(
          error.message ||
          "Something went wrong. Please check your internet connection and try again."
        );
      } finally {
        setLoading(false);
      }
    }

    searchForm.addEventListener("submit", event => {
      event.preventDefault();

      const city = cityInput.value.trim();

      if (!city) {
        showMessage("Please enter a city name.");
        return;
      }

      searchWeather(city);
    });

    // Initial example city.
    searchWeather("Chennai");
  </script>
</body>
</html>
